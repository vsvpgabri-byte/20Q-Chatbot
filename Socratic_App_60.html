<script>
/* ---------- Absicherung für eingeschränkte Viewer (z. B. HTML-Viewer-Apps auf dem iPad) ----------
   Manche Viewer-Apps stellen kein vollständiges "console"-Objekt bereit.
   Dann scheitert jeder Aufruf von console.error() selbst – ausgerechnet
   in den Fehler-Abfangblöcken, die eigentlich einen Ersatzwert liefern
   sollten. Hier werden fehlende Funktionen durch "stille" Platzhalter
   ersetzt, damit die Fallbacks im ganzen Programm wieder greifen.
------------------------------------------------------------------ */
(function () {
  try {
    if (typeof window.console !== "object" || window.console === null) window.console = {};
    ["log", "warn", "error", "info"].forEach(function (fn) {
      if (typeof window.console[fn] !== "function") window.console[fn] = function () {};
    });
  } catch (e) { /* Viewer erlaubt kein Überschreiben – safeLog() unten fängt das ab */ }
})();

/* ---------- VERSION 60: sicheres Protokollieren ----------
   Der Platzhalter oben hat im iPad-Viewer NICHT gegriffen (Daten
   vom 28.10.2026: 24 % aller Eingaben endeten mit "console.error is
   not a function"). Darum ruft das Programm console.error() nirgends
   mehr direkt auf, sondern nur noch safeLog(). safeLog() kann
   unter keinen Umständen selbst einen Fehler auslösen.
------------------------------------------------------------------ */
function safeLog() {
  try {
    var c = (typeof console !== "undefined") ? console : null;
    if (c && typeof c.error === "function") c.error.apply(c, arguments);
  } catch (e) { /* bewusst leer */ }
}

/* ---------- VERSION 60: OpenAI-Aufruf mit automatischer Wiederholung ----------
   Wenn ~20 Kinder gleichzeitig mit demselben API-Key spielen, meldet
   OpenAI zeitweise "Rate limit" (HTTP 429) oder es gibt kurze
   Netzwerkaussetzer. Statt sofort "Hoppla" zu zeigen, wird der Aufruf
   bis zu 3-mal mit kurzer Wartezeit wiederholt. Gibt den Antworttext
   der KI zurück oder wirft einen Fehler mit der ECHTEN Ursache
   (erscheint im Export in der Zeile "System (nur Lehrperson)").
------------------------------------------------------------------ */
const API_MAX_ATTEMPTS = 3;
const sleep = ms => new Promise(res => setTimeout(res, ms));
async function callOpenAI(messages, temperature) {
  let lastErr = null;
  for (let attempt = 1; attempt <= API_MAX_ATTEMPTS; attempt++) {
    let retryable = true, waitMs = null;
    try {
      const response = await fetch("https://api.openai.com/v1/chat/completions", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + apiKey },
        body: JSON.stringify({ model: "gpt-4o-mini", temperature: temperature == null ? 0 : temperature, messages })
      });
      let data = null;
      try { data = await response.json(); } catch (e) { data = null; }
      if (!response.ok || !data || data.error) {
        const msg = (data && data.error && (data.error.message || data.error.type)) || "keine lesbare Antwort";
        retryable = response.status === 429 || response.status >= 500 || !data;
        const m = /try again in ([\d.]+)\s*(ms|s)\b/i.exec(msg);
        if (m) waitMs = parseFloat(m[1]) * (m[2].toLowerCase() === "s" ? 1000 : 1);
        throw new Error(`OpenAI-API-Fehler (HTTP ${response.status}): ${msg}`);
      }
      if (!data.choices || !data.choices[0] || !data.choices[0].message) throw new Error("Leere Antwort der KI");
      return String(data.choices[0].message.content || "").trim();
    } catch (err) {
      lastErr = err;
      if (!retryable || attempt === API_MAX_ATTEMPTS) break;
      const backoff = waitMs != null ? Math.min(waitMs + 200, 8000) : 700 * Math.pow(2, attempt - 1) + Math.random() * 400;
      try { statusDiv.textContent = "Der Coach überlegt noch …"; } catch (e) {}
      await sleep(backoff);
    }
  }
  const e = new Error(`${lastErr ? lastErr.message : "unbekannter Fehler"} (nach ${API_MAX_ATTEMPTS} Versuchen)`);
  throw e;
}

const DIFFICULTIES = [
  { topic: "Berufe",       label: "Einfach",         icon: "👔" },
  { topic: "Fahrzeuge",    label: "Leicht",          icon: "🚗" },

];

// Max. aufeinanderfolgende Coaching-Eingriffe (Runde 2) pro Frage-Slot,
// bevor die Frage trotzdem durchgelassen wird.
const INTERVENTION_LIMIT = 2;

/* ---------- Lehrperson-Zugang für Debug-Funktionen ----------
   "Warum diese Antwort?" und "Chatverlauf ansehen" sind für den
   Prototyp-/Testbetrieb gedacht, nicht für die SuS im normalen
   Ablauf. Sie sind standardmässig versteckt und werden nur nach
   Eingabe der PIN über den kleinen 🔧-Link sichtbar. WICHTIG: Das
   ist nur ein Schutz gegen zufälliges Anklicken durch Kinder, keine
   echte Sicherheit – die PIN steht im Klartext im Quellcode.
------------------------------------------------------------------ */
const TEACHER_PIN = "2580";
let teacherModeUnlocked = false;

function unlockTeacherMode() {
  if (teacherModeUnlocked) return;
  const input = prompt("PIN für Lehrpersonen-Ansicht eingeben:");
  if (input === TEACHER_PIN) {
    teacherModeUnlocked = true;
    document.getElementById("debugBtn").classList.remove("hidden");
    document.getElementById("chatReviewBtn").classList.remove("hidden");
    // Auch bereits vorhandene 🔍-Icons bei früheren Fragen sichtbar machen
    // (z. B. wenn die PIN erst nach mehreren Fragen eingegeben wird).
    document.querySelectorAll(".teacher-icon").forEach(el => el.classList.remove("hidden"));
  } else if (input !== null) {
    alert("Falsche PIN.");
  }
}

/* ---------- API-Key-Format prüfen ----------
   HTTP-Header (hier: Authorization) dürfen nur druckbare
   ISO-8859-1/ASCII-Zeichen enthalten. Enthält der eingefügte Key
   z. B. ein unsichtbares Sonderzeichen oder eine "intelligente"
   Anführungszeichen-Variante (oft durch Kopieren aus Notiz-Apps
   mit Autokorrektur), schlägt fetch() sonst erst mitten im Spiel
   mit einer kryptischen Meldung fehl. Hier wird das vorab geprüft.
------------------------------------------------------------------ */
function isValidApiKeyFormat(key) {
  return /^[\x20-\x7E]+$/.test(key);
}

/* ---------- Faktentabelle: Studium nötig? (nur Berufe) ----------
   Bei nur 16 Berufen lässt sich diese Eigenschaft fest hinterlegen,
   statt sie der KI bei jeder Frage neu (und manchmal falsch, z. B.
   Elektriker) einschätzen zu lassen. Wird nur eingespeist, wenn die
   Frage tatsächlich nach "studieren"/"Studium" fragt.
   Hinweis: Einschätzung für den Schweizer Kontext (Studium =
   Universität/ETH/Fachhochschule; Berufslehre gilt NICHT als
   Studium). Bei Grenzfällen (z. B. Lehrer via PH) bitte bei Bedarf
   anpassen.
------------------------------------------------------------------ */
const PROFESSION_STUDY_FACTS = {
  "Lehrer": true,
  "Arzt": true,
  "Feuerwehrmann": false,
  "Polizist": false,
  "Koch": false,
  "Bäcker": false,
  "Pilot": false,
  "Sänger": false,
  "Bauer": false,
  "Zahnarzt": true,
  "Astronaut": true,
  "Frisör": false,
  "Elektriker": false,
  "Gärtner": false,
  "Tierarzt": true,
  "Anwalt": true
};

function findProfessionStudyHint(question, topic) {
  if (topic !== "Berufe") return null;
  if (!/studier|studium/i.test(question)) return null;
  const braucht = Object.keys(PROFESSION_STUDY_FACTS).filter(k => PROFESSION_STUDY_FACTS[k]);
  const brauchtNicht = Object.keys(PROFESSION_STUDY_FACTS).filter(k => !PROFESSION_STUDY_FACTS[k]);
  return `Fakten zum Studium (Schweizer Kontext, Berufslehre zählt NICHT als Studium): Studium nötig bei: ${braucht.join(", ")}. Kein Studium nötig (Berufslehre) bei: ${brauchtNicht.join(", ")}.`;
}

------------------------------------------------------------------ */
const VEHICLE_ROAD_FACTS = {

};

function findVehicleRoadHint(question, topic) {

/* ---------- Faktentabelle: Frucht oder Gemüse? (nur Lebensmittel) ----------
   Botanisch sind Tomate, Gurke, Erbse, Kürbis etc. Früchte (entwickeln
   sich aus dem Fruchtknoten), umgangssprachlich gelten sie aber klar
   als Gemüse. Die KI hat diese beiden Definitionen bisher inkonsistent
   vermischt (z. B. Erbse fälschlich als "Ja" auf BEIDE Fragen "Frucht?"
   und "Gemüse?" eingestuft). Diese Tabelle erzwingt die alltägliche,
   sich gegenseitig ausschliessende Einteilung für Kinder.

/* ---------- Generelle Vergleichsform-Erkennung ----------
   Erkennt die deutsche Komparativ-Konstruktion "...er als ein/eine
   X" (z. B. "gesünder als ein Schokoriegel", "grösser als ein Hund",
   "teurer als ein Motorrad") UNABHÄNGIG vom konkreten Adjektiv, UND
   die Gleichheitsform "so/genauso/gleich X wie Y" (z. B. "genauso
   gross wie ein Hund", "doppelt so teuer wie ein Buch"). Läuft rein
   regelbasiert (kein API-Aufruf, kein Sprachmodell-Risiko) und
   verhindert zuverlässig, dass die Vage-Erkennung bei JEDEM neuen
   Adjektiv erneut anschlägt, obwohl bereits mit einem konkreten
   Objekt verglichen wird.
   WICHTIG: Nutzt eine eigene Zeichenklasse statt \w, weil \w in
   JavaScript deutsche Umlaute (ä/ö/ü) NICHT erfasst – sonst würde
   z. B. "gefährlicher" an der Stelle des "ä" reissen.
------------------------------------------------------------------ */
function isComparativeWithObject(question) {
  const W = "[a-zA-ZäöüÄÖÜß]+"; // eigene "Wort"-Definition inkl. Umlaute
  const alsPattern = new RegExp(`\\b(${W}er|mehr|weniger)\\b\\s+als\\s+(ein|eine|einen|einem|der|die|das)?\\s*${W}`, "i");
  const wiePattern = new RegExp(`\\b(genauso|ebenso|gleich|doppelt so|halb so|so)\\s+${W}\\s+wie\\s+(ein|eine|einen|einem|der|die|das)?\\s*${W}`, "i");
  // VERSION 60: auch Vergleiche mit einer Zahl/Masseinheit gelten als klar
  // (z. B. "Ist es schwerer als 60kg?", "Ist es länger als 2 Meter?")
  const numberPattern = new RegExp(`\\b(${W}er|mehr|weniger)\\b\\s+als\\s+\\d`, "i");
  return alsPattern.test(question) || wiePattern.test(question) || numberPattern.test(question);
}

/* ---------- (4) du-Form & fehlendes Fragezeichen intern ausgleichen ----------
   Kinder schreiben oft "Bist du ein Arzt" oder "Arbeitest du draussen".
   Für die KI wird die Frage intern in die es-Form gebracht und bei
   Bedarf ein Fragezeichen ergänzt. Im Chat und im Export bleibt die
   ORIGINALE Frage des Kindes stehen.
------------------------------------------------------------------ */
const DU_VERB_EXCEPTIONS = {
  "bist": "ist", "hast": "hat", "kannst": "kann", "willst": "will", "musst": "muss",
  "darfst": "darf", "sollst": "soll", "magst": "mag", "weisst": "weiss", "weißt": "weiß",
  "isst": "isst", "frisst": "frisst", "liest": "liest", "heisst": "heisst", "heißt": "heißt",
  "wirst": "wird", "trittst": "tritt", "hältst": "hält", "läufst": "läuft"
};
function normalizeQuestionForAI(question) {
  let q = question.trim();
  // "<Verb>st du" -> "<Verb>t es"
  q = q.replace(/\b([A-Za-zÄÖÜäöüß]+)\s+du\b/gi, (match, verb) => {
    const lower = verb.toLowerCase();
    let newVerb = null;
    if (DU_VERB_EXCEPTIONS[lower]) newVerb = DU_VERB_EXCEPTIONS[lower];
    else if (/est$/.test(lower) && lower.length > 4) newVerb = lower.slice(0, -3) + "et"; // arbeitest -> arbeitet
    else if (/st$/.test(lower) && lower.length > 3) newVerb = lower.slice(0, -2) + "t";   // machst -> macht
    else if (/tes$/.test(lower) && lower.length > 5) newVerb = lower.slice(0, -2) + "et"; // Tippfehler "Arbeites" -> "Arbeitet"
    if (!newVerb) return match;
    if (verb[0] === verb[0].toUpperCase()) newVerb = newVerb[0].toUpperCase() + newVerb.slice(1);
    return newVerb + " es";
  });
  // "du" an anderer Stelle (z. B. "Kannst du..." schon ersetzt; "Machst du etwas mit...")
  q = q.replace(/\bdu\b/gi, "es");
  // Possessiv "dein/deinem/..." -> "dieser Beruf/dieses Ding"
  q = q.replace(/\bdeinem\b/gi, "diesem").replace(/\bdeiner\b/gi, "dieser")
       .replace(/\bdeinen\b/gi, "diesen").replace(/\bdeine\b/gi, "diese")
       .replace(/\bdein\b/gi, "der").replace(/\bdei\b/gi, "der");
  // Fragezeichen ergänzen (bzw. Tippfehler wie ' oder $ am Ende ersetzen)
  q = q.replace(/[\s'´`$.!,;:]+$/, "");
  if (!q.endsWith("?")) q += "?";
  return q;
}

/* ---------- Textvergleich (für Treffer- und Wiederholungserkennung) ---------- */
function normalizeWord(w) {
  return w.toLowerCase()
    .replace(/ß/g, "ss").replace(/ä/g, "a").replace(/ö/g, "o").replace(/ü/g, "u")
    .replace(/[éèê]/g, "e").replace(/[àâ]/g, "a")
    .replace(/[^a-z]/g, "")
    .replace(/tz/g, "z")      // "Artzt" -> "Arzt"
    .replace(/h(?=[^aeiou]|$)/g, "") // stummes h: "Dreirahd" -> "Dreirad", "Fahrrad" -> "Farrad"
    .replace(/(.)\1+/g, "$1"); // Doppelbuchstaben: "Harre" -> "Hare", "Fahrad"/"Fahrrad"
}
function editDistance(a, b) {
  if (a === b) return 0;
  const dp = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) dp[0][j] = j;
  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++) {
      dp[i][j] = Math.min(
        dp[i - 1][j] + 1, dp[i][j - 1] + 1,
        dp[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)
      );
    }
  }
  return dp[a.length][b.length];
}
function wordsSimilar(word, name) {
  if (!word || !name) return false;
  if (word === name) return true;
  const maxDist = name.length <= 4 ? 0 : (name.length <= 7 ? 1 : 2);
  if (editDistance(word, name) <= maxDist) return true;
  // weibliche Form: "Lehrerin" = "Lehrer", "Ärztin" = "Arzt", "Polizistin" = "Polizist"
  if (word.endsWith("in") && word.length > 4) {
    const stem = word.slice(0, -2);
    if (stem === name || (name.length > 4 && editDistance(stem, name) <= 1)) return true;
  }
  return false;
}

/* ---------- (1) Direkte Vermutung lokal erkennen ----------
   Prüft OHNE KI, ob die Frage eine direkte Vermutung ist ("Ist es ein
   Zahnarzt?", "Bist du anwalt", "Ist die arbeit lehrer", "Krake?")
   und welcher Kandidat aus dem Thema gemeint ist. Tippfehler, Gross-/
   Kleinschreibung, du-Form, weibliche Formen und fehlende Fragezeichen
   werden toleriert.
   Gibt den Kandidatennamen zurück oder null.
------------------------------------------------------------------ */
const GUESS_START_VERBS = ["ist", "bist", "isch", "sind", "wars", "war", "es"];
const GUESS_FILLERS = ["es", "du", "er", "sie", "das", "der", "die", "den", "ein", "eine", "einen", "einem", "einer",
  "dein", "dei", "deine", "deinem", "dieser", "dieses", "diese", "dises", "dise", "gesuchte", "gesuchtes",
  "beruf", "arbeit", "job", "tier", "fahrzeug", "ding", "sache", "gegenstand", "essen", "lebensmittel",
  "vieleicht", "vielleicht", "also", "denn", "etwa", "wohl", "dan", "dann", "jetzt", "art", "von", "so"];
function findGuessedCandidate(question, topic) {
  const list = TOPICS[topic] || [];
  const rawWords = question.split(/[\s\-\/]+/).map(normalizeWord).filter(Boolean);
  if (rawWords.length === 0 || rawWords.length > 8) return null;

  let words = rawWords;
  if (words.length > 1) {
    // Muss wie eine Vermutung beginnen ("Ist ...", "Bist ...")
    if (!GUESS_START_VERBS.map(normalizeWord).includes(words[0])) return null;
    words = words.slice(1);
  }
  // Füllwörter vorne entfernen; übrig bleiben darf NUR der Name (1–2 Wörter)
  const fillers = GUESS_FILLERS.map(normalizeWord);
  while (words.length > 0 && fillers.includes(words[0])) words = words.slice(1);
  if (words.length === 0 || words.length > 2) return null;

  return matchName(words.join(""), list);
}
function matchName(word, list) {
  if (NAME_SYNONYMS[word] && list.includes(NAME_SYNONYMS[word])) return NAME_SYNONYMS[word];
  // exakter Treffer zuerst (damit "Arzt" nicht als "Zahnarzt" erkannt wird o. ä.)
  for (const c of list) if (normalizeWord(c) === word) return c;
  let best = null, bestDist = Infinity;
  for (const c of list) {
    const n = normalizeWord(c);
    if (wordsSimilar(word, n)) {
      const d = editDistance(word, n);
      if (d < bestDist) { best = c; bestDist = d; }
    }
  }
  return best;
}

function isIncompleteQuestion(question) {
  const words = question.split(/\s+/).map(normalizeWord).filter(Boolean);
  const filler = ["ist", "bist", "hat", "hast", "kann", "kannst", "es", "du", "das", "der", "die", "ein", "eine", "isch"];
  return words.length > 0 && words.length <= 3 && words.every(w => filler.includes(w));
}

/* ---------- (A) Buchstaben-Fragen OHNE KI beantworten ----------
   Die KI liest Wörter nicht Buchstabe für Buchstabe, sondern in
   Wortstücken. Am 28.10. waren darum 3 von 6 Buchstaben-Fragen falsch
   (z. B. "Ist im Namen ein O?" bei «Teller» -> Ja). Solche Fragen
   werden jetzt direkt im Programm anhand der Schreibweise geprüft –
   für ALLE Kandidaten, die Antwort ist damit immer richtig.
   Erkannt werden z. B.:
     "Ist im Namen ein E?", "Hat es ein E im Namen?", "Kommt ein A im Wort vor?"
     "Beginnt es mit B?", "Fängt der Name mit K an?", "Endet es mit R?"
     "Hat der Name mehr als 5 Buchstaben?", "Hat das Wort 4 Buchstaben?"
     "Ein A?" / "Und ein U?" direkt nach einer Buchstaben-Frage
     "Ist kein E im Namen?" (Verneinung wird berücksichtigt)
   UMLAUT_COUNTS_AS_BASE = true: Bei der Frage nach "A" zählt auch "Ä"
   (Bäcker hat ein A). Wird ausdrücklich nach "Ä" gefragt, zählt nur "Ä".
   Auf false setzen, wenn Ä/Ö/Ü als eigene Buchstaben gelten sollen.
------------------------------------------------------------------ */
const UMLAUT_COUNTS_AS_BASE = true;
let lastWasLetterQuestion = false;

function nameLetters(name) {
  return name.toLowerCase().replace(/[^a-zäöüß]/g, "");
}
function letterMatches(ch, letter) {
  if (ch === letter) return true;
  if (UMLAUT_COUNTS_AS_BASE) {
    if (letter === "a" && ch === "ä") return true;
    if (letter === "o" && ch === "ö") return true;
    if (letter === "u" && ch === "ü") return true;
    if (letter === "s" && ch === "ß") return true;
  }
  return false;
}
function letterRuleAnswer(question, candidateList, prevWasLetter) {
  const text = question.toLowerCase().replace(/[„“"«»'´`‘’?!.,;:()\-]/g, " ").replace(/\s+/g, " ").trim();
  const tokens = text.split(" ").filter(Boolean);
  const singles = tokens.filter(t => /^[a-zäöü]$/.test(t));
  const mentionsName = /\b(namen?|nahmen?|wort|wortes|buchstaben?|buchstabe)\b/.test(text);
  const negated = /\b(kein|keinen|keine|nicht)\b/.test(text);

  // Länge: "mehr als 5 Buchstaben", "weniger als 6 Buchstaben", "5 Buchstaben"
  const lenCmp = /\b(mehr|weniger) als (\d+) buchstaben?\b/.exec(text);
  const lenEq = /\b(\d+) buchstaben?\b/.exec(text);
  if (lenCmp || lenEq) {
    let test;
    if (lenCmp) {
      const n = parseInt(lenCmp[2], 10);
      test = lenCmp[1] === "mehr" ? (c => nameLetters(c).length > n) : (c => nameLetters(c).length < n);
    } else {
      const n = parseInt(lenEq[1], 10);
      test = c => nameLetters(c).length === n;
    }
    const yes = candidateList.filter(c => test(c) !== negated);
    return { yes, no: candidateList.filter(c => !yes.includes(c)), label: "Buchstabenregel (Länge)" };
  }

  if (singles.length !== 1) return null;
  const letter = singles[0];

  const beginsVerb = /\b(beginnt|beginnst|fängt|faengt|fängst|startet|anfangsbuchstabe|anfang|erster|erste|ersten)\b/.test(text);
  const endsVerb = /\b(endet|endest|hört|hoert|hörst|aufhört|letzter|letzte|letzten|ende|endbuchstabe|schluss)\b/.test(text);
  const shortElliptical = prevWasLetter && tokens.length <= 3 &&
    tokens.every(t => ["und", "ein", "einen", "eine", "auch", "es", "hat", "mit", letter].includes(t));

  if (!(mentionsName || beginsVerb || endsVerb || shortElliptical)) return null;

  let test, label;
  if (beginsVerb) {
    test = c => { const n = nameLetters(c); return n.length > 0 && letterMatches(n[0], letter); };
    label = "Buchstabenregel (Anfang)";
  } else if (endsVerb) {
    test = c => { const n = nameLetters(c); return n.length > 0 && letterMatches(n[n.length - 1], letter); };
    label = "Buchstabenregel (Ende)";
  } else {
    test = c => [...nameLetters(c)].some(ch => letterMatches(ch, letter));
    label = "Buchstabenregel (enthält)";
  }
  const yes = candidateList.filter(c => test(c) !== negated);
  return { yes, no: candidateList.filter(c => !yes.includes(c)), label };
}

/* ---------- (B) Feste Tier-Fakten: Beine, Flossen, Meer ----------
   Am 28.10. wurde z. B. "Hat es Beine?" beim Wal mit Ja beantwortet,
   bei der Robbe "Beine: Ja" und gleichzeitig "vier Beine: Nein".
   Ausserdem blieben bei "Lebst du im Meer?" Bär, Waschbär und Tiger
   übrig (die KI denkt an Eisbär, an Tiger, die an Küsten schwimmen,
   und an das Wort "Bär" in "Waschbär").
   Festgelegt (Alltagssprache der Kinder):
   - Flossen zählen NICHT als Beine.
   - Affen und Kängurus haben 2 Beine (und 2 Arme).
   - "Im Meer" leben nur Tiere, deren Lebensraum das Meer ist.
   >>> BITTE FACHLICH PRÜFEN und bei Bedarf anpassen. <<<
   Einfache Fragen wie "Hat es Beine?", "Hat es vier Beine?", "Hat es
   Flossen?", "Lebt es im Meer?" (auch du-Form, "dieses Tier") werden
   direkt aus dieser Tabelle beantwortet. Kompliziertere Fragen
   ("Hat es lange Beine?", "Lebt es nicht im Meer?") gehen weiter an
   die KI, die diese Tabelle als verbindliche Regel mitbekommt.
------------------------------------------------------------------ */
const ANIMAL_LEGS = {
  0: ["Hai", "Schlange", "Krake", "Delfin", "Wal", "Robbe"],
  2: ["Adler", "Pinguin", "Huhn", "Papagei", "Eule", "Storch", "Schwan", "Affe", "Gorilla", "Schimpanse", "Känguru"],
  6: ["Biene", "Schmetterling"],
  8: ["Spinne", "Skorpion"]
  // alle übrigen Tiere der Liste: 4 Beine
};
const ANIMAL_FINS = ["Hai", "Delfin", "Wal", "Robbe"];
const ANIMAL_SEA = ["Hai", "Krake", "Delfin", "Wal", "Robbe", "Pinguin"];

function legCount(animal) {
  for (const n of [0, 2, 6, 8]) if (ANIMAL_LEGS[n].includes(animal)) return n;
  return 4;
}
const NUMBER_WORDS = { "zwei": 2, "2": 2, "vier": 4, "4": 4, "sechs": 6, "6": 6, "acht": 8, "8": 8 };

function animalRuleAnswer(question, topic, candidateList) {
  if (topic !== "Tiere") return null;
  let s = question.toLowerCase().replace(/[^a-zäöüß0-9 ]/g, " ").replace(/\s+/g, " ").trim();
  s = s.replace(/\b(das|dieses|dises|dein|deine|dieser|diese|dise|dies) tier\b/g, "es")
       .replace(/\b(du|man|er|sie)\b/g, "es")
       .replace(/\bhet\b/g, "hat").replace(/\bhast\b/g, "hat")
       .replace(/\b(lebst|wohnst|wohnt|schwimmst)\b/g, "lebt").replace(/\bschwimmt\b/g, "lebt");
  // Verneinungen, Verknüpfungen und genauere Beschreibungen -> lieber die KI fragen
  if (/\b(nicht|kein|keine|keinen|und|oder|nur|lange|kurze|starke|grosse|kleine|dünne|dicke|bunte)\b/.test(s)) return null;

  const pick = test => {
    const yes = candidateList.filter(test);
    return { yes, no: candidateList.filter(c => !yes.includes(c)) };
  };
  let m;
  if ((m = /^(?:hat|besitzt) es (?:(zwei|2|vier|4|sechs|6|acht|8) )?beine$/.exec(s))) {
    if (m[1]) { const n = NUMBER_WORDS[m[1]]; return { ...pick(c => legCount(c) === n), label: "Tierregel (Anzahl Beine)" }; }
    return { ...pick(c => legCount(c) > 0), label: "Tierregel (Beine)" };
  }
  if ((m = /^(?:hat|besitzt) es (mehr|weniger) als (zwei|2|vier|4|sechs|6|acht|8) beine$/.exec(s))) {
    const n = NUMBER_WORDS[m[2]];
    return { ...pick(c => m[1] === "mehr" ? legCount(c) > n : legCount(c) < n), label: "Tierregel (Anzahl Beine)" };
  }
  if (/^(?:hat|besitzt) es flossen$/.test(s)) {
    return { ...pick(c => ANIMAL_FINS.includes(c)), label: "Tierregel (Flossen)" };
  }
  if (/^(?:lebt|ist) es (?:im|in dem|in einem|in|am) (?:meer|ozean)$/.test(s)) {
    return { ...pick(c => ANIMAL_SEA.includes(c)), label: "Tierregel (Meer)" };
  }
  return null;
}

// Für kompliziertere Fragen: dieselben Fakten als verbindliche Regel für die KI
function findAnimalFeatureHint(question, topic) {
  if (topic !== "Tiere") return null;
  const parts = [];
  if (/bein|flosse/i.test(question)) {
    parts.push(`Beine: Flossen zählen NICHT als Beine. KEINE Beine haben: ${ANIMAL_LEGS[0].join(", ")}. ZWEI Beine haben: ${ANIMAL_LEGS[2].join(", ")} (Affen und Kängurus: 2 Beine und 2 Arme). SECHS Beine: ${ANIMAL_LEGS[6].join(", ")}. ACHT Beine: ${ANIMAL_LEGS[8].join(", ")}. Alle anderen Tiere haben VIER Beine. Flossen haben: ${ANIMAL_FINS.join(", ")}.`);
  }
  if (/meer|ozean|salzwasser/i.test(question)) {
    parts.push(`Meer: Im Meer leben NUR ${ANIMAL_SEA.join(", ")}. Alle anderen Tiere leben NICHT im Meer – auch nicht Bär (gemeint ist kein Eisbär), Waschbär, Tiger, Krokodil, Otter, Schildkröte oder Frosch.`);
  }
  if (parts.length === 0) return null;
  return `Feste Faktenregeln für dieses Spiel (VERBINDLICH, gehen deinem eigenen Wissen vor):\n- ${parts.join("\n- ")}`;
}

/* ---------- (C) Gültige Fragen nicht als "unverständlich" ablehnen ----------
   Am 28.10. lehnte die KI 21 Fragen als "kein verständlicher Satz" ab,
   darunter viele gute ("Fliegt es?", "Ist es heiss?", "Arbeitet es in
   garten?"). Beginnt eine Eingabe mit einem typischen Fragewort-Verb und
   hat sie mindestens zwei Wörter, gilt sie jetzt immer als verständlich.
------------------------------------------------------------------ */
const QUESTION_START_VERBS = ["ist", "isch", "bist", "hat", "hast", "het", "kann", "kannst", "wird", "lebt", "lebst",
  "arbeitet", "arbeitest", "macht", "machst", "braucht", "brauchst", "gibt", "fahrt", "fahrst", "fliegt", "fliegst",
  "frisst", "isst", "tut", "tust", "muss", "musst", "darf", "sind", "war", "liebt", "backt", "baut", "hilft", "benutzt",
  "schwimmt", "kocht", "singt", "schneidet", "rettet", "lernt", "wohnt", "tragt", "spielt", "gehort", "besteht",
  "passt", "steht", "liegt", "riecht", "schmeckt", "legt", "frist", "esst"];
function looksLikeRealQuestion(question) {
  const words = question.trim().split(/\s+/).filter(Boolean);
  if (words.length < 2) return false;
  const letters = (question.match(/[a-zA-ZäöüÄÖÜß]/g) || []).length;
  const nonSpace = question.replace(/\s/g, "").length;
  if (nonSpace === 0 || letters / nonSpace < 0.7) return false;
  return QUESTION_START_VERBS.map(normalizeWord).includes(normalizeWord(words[0]));
}

/* ---------- VERSION 58: Chatverlauf protokollieren ----------
   Jede Nachricht (Kind, Chatbot, System) wird mit Uhrzeit gespeichert,
   damit sie im Gesamt-Export erscheint. HTML (z. B. das 🔍-Symbol für
   die Lehrperson) wird entfernt, nur der lesbare Text bleibt.

   Ergebnissen der Frage).
------------------------------------------------------------------ */
function recordChat(role, html) {
  const tmp = document.createElement("div");
  tmp.innerHTML = html;
  const plain = (tmp.textContent || "").replace(/🔍/g, "").replace(/\s+/g, " ").trim();
  const now = new Date();
  const pad = n => String(n).padStart(2, "0");
  chatLog.push({
    zeit: `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`,
    rolle: role,
    text: plain,
    nr: null,        // Fragenummer, falls diese Kind-Nachricht als Frage gezählt wurde
    coaching: ""     // Grund, falls der Coach eingegriffen hat
  });
  return chatLog.length - 1;
}

/* ---------- Soundeffekte (Web Audio API, keine externen Dateien) ---------- */
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playTone(freq, duration, type = "sine", delay = 0, volume = 0.15) {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.value = volume;
    osc.connect(gain);
    gain.connect(ctx.destination);
    const startTime = ctx.currentTime + delay;
    osc.start(startTime);
    gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
    osc.stop(startTime + duration);
  } catch (err) {
    safeLog("Sound konnte nicht abgespielt werden:", err);
  }
}
function playClickSound() { playTone(600, 0.06, "square", 0, 0.08); }
function playAnswerSound(answer) {
  if (answer === "Ja") { playTone(660, 0.12); playTone(880, 0.15, "sine", 0.1); }
  else { playTone(330, 0.15); }
}
function playHintSound() { playTone(440, 0.1, "triangle"); playTone(392, 0.15, "triangle", 0.12); }
function playWinSound() {
  [523, 659, 784, 1047].forEach((freq, i) => playTone(freq, 0.2, "sine", i * 0.13, 0.12));
}

/* ---------- Debug: KI-Klassifikation offenlegen ----------
   Zeigt direkt im Chat, wie die KI die LETZTE Frage tatsächlich
   beantwortet hat – welche Kandidaten sie in JA und welche in NEIN
   eingeteilt hat. Nutzt die bereits berechnete Klassifikation
   (kein zusätzlicher API-Aufruf, daher keine Gefahr einer
   nachträglich erfundenen Erklärung).
------------------------------------------------------------------ */
function formatGroup(arr) {
  if (arr.length === 0) return "(keine)";
  if (arr.length <= 20) return arr.join(", ");
  return arr.slice(0, 20).join(", ") + ` … und ${arr.length - 20} weitere`;
}

    `🔍 Klassifikation zur Frage «${question}»:\n` +

}
