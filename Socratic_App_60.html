/* ---------- Frage verarbeiten ---------- */
async function send() {
  // VERSION 60: Solange die vorige Frage noch verarbeitet wird, wird
  // eine weitere Eingabe (z. B. per Enter-Taste) ignoriert – der Text
  // bleibt im Eingabefeld stehen. Am 28.10. gingen sonst Antworten
  // verloren (die Liste sprang zurück auf alle Kandidaten).
  if (!roundActive || sending) return;
  const input = document.getElementById("questionInput");
  const question = input.value.trim();
  if (!question) return;
  input.value = "";

  addMessage("Kind", question);
  const kidChatIndex = chatLog.length - 1; // VERSION 58: Verknüpfung Chat ↔ Ergebnis

  // Grundprüfung (regelbasiert, kein API-Aufruf): enthält die
  // Eingabe überhaupt genug Buchstaben, um ein sinnvoller Satz zu
  // sein? Fängt Eingaben wie "...", "??", "123" oder leere
  // Interpunktion ab, BEVOR irgendeine Klassifikation läuft.
  const letterCount = (question.match(/[a-zA-ZäöüÄÖÜßàéè]/g) || []).length;
  if (letterCount < 3) {
    addMessage("20Q-Chatbot", "❌ Das ist kein vollständiger Satz. Bitte stelle eine richtige Frage.");
    return;
  }

  // Direkt nach einem "Denkanstoss" (vorzeitiges Scannen / kein
  // Informationsgewinn): prüfen, ob wirklich eine neue Frage gestellt
  // wurde (statt einer kurzen Direktantwort wie "ja"). Gilt NICHT
  // nach einer "Wie meinst du X?"-Klärungsfrage – dort ist eine
  // kurze Antwort (z. B. "grösser als ein Hund") genau das erwartete
  // und erwünschte Verhalten, wird also normal weiterverarbeitet.
  // Unvollständige Frage wie "Ist es" oder "Bist du" (kam in den
  // Klassendaten vor und wurde von der KI mit "Ja" beantwortet).
  if (isIncompleteQuestion(question)) {
    addMessage("20Q-Chatbot", "🙂 Deine Frage ist noch nicht fertig. Was möchtest du wissen? Zum Beispiel: «Ist es ein …?» oder «Hat es …?»");
    return;
  }

  if (awaitingNewQuestion) {
    // Beginnt die Eingabe wie eine Frage ("Hat es…", "Ist es…", "Bist du…"),
    // gilt sie als neue Frage – auch ohne Fragezeichen.
    const startsLikeQuestion = /^(ist|bist|hat|hast|kann|kannst|wird|lebt|arbeitet|arbeitest|macht|machst|braucht|gibt|fährt|frisst|isst|tut|tust|muss|darf|sind|war)\b/i.test(question);
    const looksLikeDirectReply = !question.includes("?") && !startsLikeQuestion && question.split(/\s+/).length <= 4;
    if (looksLikeDirectReply) {
      addMessage("20Q-Chatbot", "Das war eine Antwort, keine neue Frage 🙂 Stell mir jetzt eine ganze Frage über das gesuchte Ding – z. B. «Ist es …?» oder «Wird es …?».");
      return;
    }
  }
  awaitingNewQuestion = false;

  playClickSound();
  setAvatarMood("thinking");
  document.getElementById("sendBtn").disabled = true;
  const previousStatus = statusDiv.textContent;
  if (candidates.length > 80) statusDiv.textContent = "Der Coach überlegt...";

  const before = [...candidates];
  sending = true;
  let answerSource = "KI";     // VERSION 60: woher die Antwort stammt (für den Export)
  let answerCorrected = false; // VERSION 60: Antwort durch Einzelprüfung korrigiert?

  try {
    // Gilt für ALLE Runden: Doppelfragen ("X und Y?", "nicht X und
    // nicht Y?") führen zu unzuverlässigen/widersprüchlichen
    // Antworten, weil unklar ist, worauf sich Ja/Nein bezieht.
    // Wird abgelehnt, bevor irgendeine andere Prüfung/Klassifikation
    // läuft – die Frage zählt nicht, Kandidaten bleiben unverändert.
    // Kombiniert mit der Fragetyp-Bestimmung in einem einzigen
    // API-Aufruf (spart einen separaten Call pro Frage).
    // (4) Für die KI: du-Form -> es-Form, Fragezeichen ergänzen.
    const aiQuestion = normalizeQuestionForAI(question);

    // (1) Direkte Vermutung lokal erkennen (ohne KI). Ist es genau das
    // Geheimnis, gilt die Frage sicher als richtige Lösung – unabhängig
    // von Fragezeichen, du-Form oder kleinen Tippfehlern.
    const guessedCandidate = findGuessedCandidate(question, topicName);
    const guessedSecret = guessedCandidate === secret;

    // VERSION 60: Buchstaben- und einfache Tierfragen lokal beantworten
    const localRule = guessedCandidate ? null
      : (letterRuleAnswer(question, before, lastWasLetterQuestion) || animalRuleAnswer(question, topicName, before));
    lastWasLetterQuestion = !!(localRule && /^Buchstabenregel/.test(localRule.label));

    let isNotYesNo = false, isMeaningless = false, isCompound = false, type = "hypothesis-scanning";
    if (localRule) {
      type = "constraint-seeking";
    } else if (!guessedCandidate) {
      ({ isNotYesNo, isMeaningless, isCompound, type } = await analyzeQuestion(aiQuestion, topicName));
      // VERSION 60: Fragen wie "Fliegt es?" nie als "unverständlich" ablehnen
      if (isMeaningless && looksLikeRealQuestion(question)) isMeaningless = false;
    }
    if (isNotYesNo) {
      addMessage("20Q-Chatbot", "❌ Bitte stelle nur Ja-/Nein-Fragen.");
      playHintSound();
      setAvatarMood("idle");
      updateStatus();
      return;
    }
    if (isMeaningless) {
      addMessage("20Q-Chatbot", "❌ Das ist kein verständlicher Satz. Bitte stelle eine richtige Frage." + questionMarkHint(question));
      playHintSound();
      setAvatarMood("idle");
      updateStatus();
      return;
    }
    if (isCompound) {
      addMessage("20Q-Chatbot", "❌ Das waren zwei Fragen auf einmal – das geht leider nicht. Bitte stell mir nur eine Frage nach der anderen!");
      playHintSound();
      setAvatarMood("idle");
      updateStatus();
      return;
    }

    // In Runde 2: zuerst prüfen, ob die Frage ein vages/subjektives
    // Wort ohne festen Massstab enthält (z. B. "gross", "gefährlich").
    // Falls ja, KEINE Klassifikation durchführen, sondern das Kind
    // bitten, die Frage genauer zu formulieren – die Frage zählt
    // nicht und die Kandidaten bleiben unverändert.
    // AUSNAHME: Folgt die Frage dem Muster "...er als ein/eine X"
    // bzw. "so X wie Y" (unabhängig vom Adjektiv, z. B. auch
    // "gesünder als ein Schokoriegel"), gilt sie als klar genug und
    // wird NICHT als vage geprüft. Sonst würde z. B. genau das
    // Beispiel, das wir dem Kind selbst als Klärung vorschlagen, bei
    // jedem neuen Adjektiv wieder abgelehnt.
    const hasReferenceSize = isComparativeWithObject(question);
    if (currentRound === 2 && !guessedCandidate && !localRule && !hasReferenceSize && interventionAttempts < INTERVENTION_LIMIT) {
      const vague = await checkVagueQuestion(aiQuestion);
      if (vague) {
        interventionAttempts++;
        const isGroup = vague.category === "gruppe";
        const rueckfrage = "Ich bin mir nicht sicher. Kannst du bitte den Satz umformulieren?" + questionMarkHint(question);

        coachingLog.push({
          runde: 2,
          versuch: interventionAttempts,
          frage: question,
          grund: isGroup ? "vage_frage_gruppe" : "vage_frage_allgemein",
          rueckfrage: rueckfrage
        });
        chatLog[kidChatIndex].coaching = isGroup ? "vage_frage_gruppe" : "vage_frage_allgemein";

        addMessage("20Q-Chatbot", `❓ ${rueckfrage}`);
        playHintSound();
        setAvatarMood("coaching");
        awaitingNewQuestion = true;
        updateStatus();
        return;
      }
    }

    // (2) Wiederholte Frage: gleiche Antwort wie beim ersten Mal,
    // KEINE weiteren Kandidaten streichen.
    const qKey = questionKey(question);
    const previous = (!guessedSecret && qKey) ? askedQuestions[qKey] : null;

    let yes, no;
    if (guessedSecret) {
      yes = [secret];
      no = before.filter(c => c !== secret);
      answerSource = "Vermutung (lokal erkannt)";
    } else if (previous) {
      yes = previous.answer === "Ja" ? [...before] : [];
      no = previous.answer === "Ja" ? [] : [...before];
      answerSource = "Wiederholung";
    } else if (localRule) {
      yes = localRule.yes;
      no = localRule.no;
      answerSource = localRule.label;
    } else {
      // Bei einem technischen Fehler wird die Klassifikation einmal
      // automatisch wiederholt, bevor die "Hoppla"-Meldung erscheint.
      try {
        ({ yes, no } = await classifyCandidates(aiQuestion, before));
      } catch (firstErr) {
        safeLog("Klassifikation fehlgeschlagen, zweiter Versuch:", firstErr);
        ({ yes, no } = await classifyCandidates(aiQuestion, before));
      }

      // VERSION 60: Kontrollfrage nur für das gesuchte Ding.
      // Beim Sortieren vieler Kandidaten auf einmal landete das gesuchte
      // Ding manchmal in der falschen Gruppe (z. B. Wal "hat Beine",
      // Panda "nicht schwerer als 60 kg", Brezel "süss"). Darum wird die
      // Frage für das gesuchte Ding einzeln nochmals geprüft; diese
      // Antwort gilt. Schlägt die Kontrolle technisch fehl, bleibt es
      // beim Ergebnis der Sortierung (kein "Hoppla").
      if (before.length > 1) {
        try {
          const check = await classifySingleCandidate(aiQuestion, secret);
          const checkYes = check.yes.includes(secret);
          const sortYes = yes.includes(secret);
          if (checkYes !== sortYes) {
            answerCorrected = true;
            if (checkYes) { yes = [...yes, secret]; no = no.filter(c => c !== secret); }
            else { no = [...no, secret]; yes = yes.filter(c => c !== secret); }
          }
        } catch (checkErr) {
          safeLog("Kontrollfrage zum gesuchten Ding fehlgeschlagen:", checkErr);
        }
      }
    }
    lastClassification = { question, yes: [...yes], no: [...no] };

    // Bestimme, in welcher Gruppe das Geheimnis liegt
    const secretInYes = yes.includes(secret);
    const answer = secretInYes ? "Ja" : "Nein";
    const after = secretInYes ? yes : no;

    // Stopping-Rule: eine Frage gilt als überflüssig, wenn schon VOR
    // dieser Frage nur noch 1 Kandidat übrig war – AUSSER es ist genau
    // die nötige, bestätigende Vermutung, die die Runde beendet. Diese
    // eine finale Frage ist erwartet und keine Verletzung.
    const isWinningGuess = (type === "hypothesis-scanning" && answer === "Ja" && after.length === 1);
    const stoppingViolation = (before.length <= 1) && !isWinningGuess;

    // Vorzeitiges Scannen: eine Frage, die ein konkretes Einzelding
    // nennt, obwohl der Suchraum noch grösser als 2 war.
    const prematureScanning = (type === "hypothesis-scanning" && before.length > 2);

    // Kein Informationsgewinn: die Frage hat den Suchraum nicht
    // verkleinert (unabhängig vom Fragetyp) – z. B. weil eine
    // Einzelvermutung keinen der tatsächlich verbleibenden
    // Kandidaten trifft, oder eine Eigenschaftsfrage nicht
    // zwischen den verbleibenden Kandidaten unterscheidet.
    const noInfoGain = (after.length === before.length && before.length > 1);

    // In Runde 2 greift der Coach ein, statt direkt zu antworten,
    // wenn die Frage ineffizient war – die Frage zählt dann NICHT
    // und die Kandidaten bleiben unverändert, das Kind darf nochmal
    // fragen. Nach INTERVENTION_LIMIT aufeinanderfolgenden Eingriffen
    // wird trotzdem normal geantwortet, damit niemand stecken bleibt.
    // WICHTIG: Eine korrekte, bestätigte Vermutung (isWinningGuess)
    // hat IMMER Vorrang vor einem Coaching-Eingriff – auch wenn sie
    // strukturell als "vorzeitig" gilt. Ein Kind, das richtig rät,
    // soll nie mit einer Rückfrage abgewiesen werden.
    // VERSION 60: Nur noch das vorzeitige Raten löst einen Denkanstoss
    // OHNE Antwort aus. Bei "kein Informationsgewinn" antwortet der
    // Chatbot jetzt normal und hängt einen kurzen Hinweis an (Feedback
    // LA, 28.10.: "es kam mega oft ein tipp obwohl die frage wichtig war
    // und die Frage wurde mir dann nie beantwortet").
    const isInefficient = prematureScanning && !isWinningGuess;

    if (currentRound === 2 && isInefficient && !previous && interventionAttempts < INTERVENTION_LIMIT) {
      interventionAttempts++;
      const reason = prematureScanning ? "premature" : "no_info_gain";
      const hint = await generateSocraticHint(question, reason, before.length);

      coachingLog.push({
        runde: 2,
        versuch: interventionAttempts,
        frage: question,
        grund: reason === "premature" ? "vorzeitiges_scannen" : "kein_informationsgewinn",
        rueckfrage: hint
      });
      chatLog[kidChatIndex].coaching = reason === "premature" ? "vorzeitiges_scannen" : "kein_informationsgewinn";

      addMessage("20Q-Chatbot", `🤔 ${hint}\n\n👉 Du musst mir darauf nicht antworten – stell mir stattdessen eine neue Frage!`);
      playHintSound();
      setAvatarMood("coaching");
      awaitingNewQuestion = true;
      updateStatus();
      return;
    }

    interventionAttempts = 0;

    questionNumber++;
    candidates = after;

    log.push({
      runde: currentRound,
      nr: questionNumber,
      frage: question,
      antwort: answer,
      kandidaten_vorher: before.length,
      kandidaten_nachher: after.length,
      typ: type,
      stopping_rule_verletzt: stoppingViolation ? "ja" : "nein",
      vorzeitiges_scannen: prematureScanning ? "ja" : "nein",
      kein_informationsgewinn: noInfoGain ? "ja" : "nein",
      quelle: answerSource,                         // VERSION 60
      korrigiert: answerCorrected ? "ja" : "nein"   // VERSION 60
    });
    chatLog[kidChatIndex].nr = questionNumber; // VERSION 58

    // Klassifikation dieser spezifischen Frage separat speichern (nicht
    // nur die letzte), damit die Lehrperson auch nach Rundenende noch
    // gezielt bei JEDER Frage nachschauen kann, nicht nur der letzten.
    questionClassifications[questionNumber] = { question, yes: [...yes], no: [...no] };
    const iconHiddenClass = teacherModeUnlocked ? "" : " hidden";
    const debugIcon = `<span class="teacher-icon${iconHiddenClass}" onclick="showClassificationFor(${questionNumber})" style="cursor:pointer; margin-left:6px;" title="Warum diese Antwort? (nur Lehrperson)">🔍</span>`;

    if (!previous && qKey) askedQuestions[qKey] = { nr: questionNumber, answer };

    if (previous) {
      addMessage("20Q-Chatbot", `${answer} – das hast du schon bei Frage ${previous.nr} gefragt. 🙂 Versuch es mit einer neuen Frage!${debugIcon}`);
    } else if (currentRound === 2 && noInfoGain && !isWinningGuess && !prematureScanning) {
      // VERSION 60: Antwort + kurzer Hinweis (statt Denkanstoss ohne Antwort)
      addMessage("20Q-Chatbot", `${answer}${debugIcon}\n💡 Diese Frage hat leider keine Möglichkeit ausgeschlossen – bei allen Dingen, die noch übrig sind, ist die Antwort gleich.`);
      chatLog[kidChatIndex].coaching = "kein_informationsgewinn_hinweis";
      coachingLog.push({ runde: 2, versuch: 0, frage: question, grund: "kein_informationsgewinn_hinweis", rueckfrage: "Antwort + Hinweis" });
    } else {
      addMessage("20Q-Chatbot", answer + debugIcon);
    }
    playAnswerSound(answer);
    setAvatarMood("happy");
    updateStatus();
    if (document.getElementById("candidateList").style.display !== "none") {
      renderCandidateList();
    }

    // Hinweis NUR dann, wenn das Kind trotz nur noch 1 verbleibender
    // Möglichkeit eine weitere Frage stellt, statt zu raten (=
    // genau der Moment der Stopping-Rule-Verletzung). Nicht bei der
    // siegreichen Vermutung selbst (das ist ja kein "Weiterfragen"),
    // nur in Runde 2 (Coaching-Kontext). Kann bei wiederholtem
    // Weiterfragen auch mehrfach erscheinen.
    if (currentRound === 2 && stoppingViolation) {
      addMessage("20Q-Chatbot", "💡 Es gibt nur noch eine Möglichkeit! Du kannst jetzt langsam anfangen zu raten, was es sein könnte.");
    }

    // Sieg nur bei einer EXPLIZITEN, bestätigten Vermutung (hypothesis-
    // scanning-Frage, die mit "Ja" beantwortet wurde und eindeutig auf
    // genau 1 Kandidat führt). Das blosse rechnerische Erreichen von
    // 1 verbleibendem Kandidaten durch eine Eigenschaftsfrage zählt
    // NICHT automatisch als Sieg – das Kind muss das Ding noch selbst
    // benennen.
    if (isWinningGuess) {
      // Nur in Runde 2: prüfen, ob die Vermutung nur eine
      // allgemeinere Kategorie trifft (z. B. "Brot" statt
      // "Baguette"). Falls ja, kein voller Sieg, sondern ein
      // Hinweis, der zur präziseren Vermutung anregt.
      if (currentRound === 2 && !guessedSecret) {
        const genericCheck = await checkGenericMatch(aiQuestion, secret, topicName);
        if (!genericCheck.exact) {
          const hint = genericCheck.hint || `Das ist im weiteren Sinn richtig, aber es gibt einen genaueren Begriff.`;
          addMessage("20Q-Chatbot", `${answer} – ${hint} Kannst du noch genauer werden?`);
          setAvatarMood("coaching");
          updateStatus();
          return;
        }
      }
      addMessage("System", `🎉 Gut gemacht! Richtig erraten! Es war «${secret}». Runde beendet nach ${questionNumber} Fragen.`);
      endRound(true, "geloest");
      return;
    }
    if (questionNumber >= 20) {
      addMessage("System", `Maximale Fragenzahl erreicht. Es war «${secret}».`);
      endRound(false, "max_fragen_erreicht");
      return;
    }

  } catch (err) {
    // Für das Kind: freundliche Rückfrage im normalen Chatbot-Stil (blau).
    addMessage("20Q-Chatbot", "🤔 Hoppla, das habe ich gerade nicht verstanden. Kannst du die Frage bitte nochmal stellen oder anders formulieren?" + questionMarkHint(question));
    // Für die Lehrperson: technische Details in Rot, nur nach PIN-Eingabe
    // sichtbar (auch im Chatverlauf-Rückblick) – für Fehlermeldungen.
    const techHidden = teacherModeUnlocked ? "" : " hidden";
    chatDiv.innerHTML += `<div class="msg-system teacher-icon${techHidden}"><b>System (nur Lehrperson):</b> ⚠️ Technischer Fehler bei der Frage «${question}»: ${err.message || "unbekannter Fehler"}</div>`;
    recordChat("System (nur Lehrperson)", `⚠️ Technischer Fehler bei der Frage «${question}»: ${err.message || "unbekannter Fehler"}`);
    chatDiv.scrollTop = chatDiv.scrollHeight;
    setAvatarMood("idle");
    updateStatus();
    safeLog(err);
  } finally {
    sending = false;
    document.getElementById("sendBtn").disabled = false;
  }
}

/* ---------- LLM-Klassifikation ----------
   Teilt die aktuell verbleibenden Kandidaten anhand der gestellten
   Frage in eine JA- und eine NEIN-Gruppe.
------------------------------------------------------------------ */
async function classifyCandidates(question, candidateList) {
  const BATCH_SIZE = 80;
  let yes = [], no = [];

  for (let i = 0; i < candidateList.length; i += BATCH_SIZE) {
    const batch = candidateList.slice(i, i + BATCH_SIZE);
    const result = await classifyBatch(question, batch);
    yes = yes.concat(result.yes);
    no = no.concat(result.no);
  }
  return { yes, no };
}

async function classifyBatch(question, batch) {
  // Sonderfall: nur noch EIN Kandidat übrig. Der generelle Listen-
  // Prompt (für viele Kandidaten gedacht) verwirrt die KI hier
  // unnötig – das ist genau der entscheidende Moment, in dem ein
  // Kind eigentlich gewinnen sollte. Direkterer, einfacherer Prompt.
  if (batch.length === 1) {
    return classifySingleCandidate(question, batch[0]);
  }

  const studyHint = findProfessionStudyHint(question, topicName);
  const studyHintText = studyHint ? `\n${studyHint}` : "";
  const roadHint = findVehicleRoadHint(question, topicName);
  const roadHintText = roadHint ? `\n${roadHint}` : "";
  const foodHint = findFoodCategoryHint(question, topicName);
  const foodHintText = foodHint ? `\n${foodHint}` : "";
  const originHint = findAnimalOriginHint(question, topicName);
  const originHintText = originHint ? `\n${originHint}` : "";
  const featureHint = findProfessionFeatureHint(question, topicName);
  const featureHintText = featureHint ? `\n${featureHint}` : "";
  const animalHint = findAnimalFeatureHint(question, topicName); // VERSION 60
  const animalHintText = animalHint ? `\n${animalHint}` : "";

  const prompt = `Hier ist eine Liste möglicher Dinge: ${batch.join(", ")}.
Frage: "${question}"${studyHintText}${roadHintText}${foodHintText}${originHintText}${featureHintText}${animalHintText}
Entscheide für JEDES Ding aus der Liste, ob die Antwort auf diese Frage JA oder NEIN wäre.

Wichtige Regeln:
1. Wenn die Frage sowohl die männliche als auch die weibliche Form eines Begriffs nennt (z. B. "Ärztin/Arzt", "Pfleger/Pflegerin", "Lehrerin/Lehrer"), behandle das als EINEN einzigen, geschlechtsneutralen Begriff und vergleiche ihn normal mit den Einträgen der Liste.
2. Behandle unterschiedliche, eigenständige Einträge der Liste als UNTERSCHIEDLICH, auch wenn sie einen gemeinsamen Wortbestandteil haben. Zum Beispiel ist "Zahnarzt" NICHT dasselbe wie "Arzt", und "Tierarzt" ist NICHT dasselbe wie "Arzt" – auch wenn alle drei "arzt" enthalten, sind es unterschiedliche, eigenständige Berufe. Ordne einen Eintrag nur dann JA zu, wenn er inhaltlich WIRKLICH dem in der Frage gemeinten Ding entspricht (bzw. dessen Geschlechtsform gemäss Regel 1), nicht nur, weil ein Wortteil übereinstimmt.
3. Regionale Synonyme gelten als dasselbe Ding: "Velo" = "Fahrrad" (Schweizerdeutsch), "Töff" = "Motorrad", "Auto" = "Personenwagen" = "PKW". Fragt das Kind z. B. "Ist es ein Velo?", ist das identisch mit "Ist es ein Fahrrad?".

Denke ZUERST für dich selbst kurz nach (1–3 Sätze): Prüfe bei jedem Ding aus der Liste kurz die tatsächlichen Fakten (z. B. welche physischen Eigenschaften es hat), bevor du dich festlegst. Das hilft, einfache Faktenfehler zu vermeiden.

Schreibe DANACH auf einer eigenen, letzten Zeile ausschliesslich das Ergebnis in diesem Format (ohne Markdown-Codeblock):
ERGEBNIS: {"JA": ["...", "..."], "NEIN": ["...", "..."]}
Jedes Ding aus der Liste muss in genau einer der beiden Gruppen erscheinen.`;

  const content = await callOpenAI([
        { role: "system", content: "Du klassifizierst Objekte für ein Ja/Nein-Ratespiel. Denke kurz nach, dann antworte im vorgegebenen Format mit einer abschliessenden JSON-Zeile." },
        { role: "user", content: prompt }
      ], 0); // VERSION 60: mit Wiederholung
  const rawText = content;
  // Robust: das JSON-Objekt wird per Regex aus der Antwort extrahiert,
  // unabhängig davon, wie viel Denktext davor steht.
  const jsonMatch = rawText.match(/\{[\s\S]*\}/);
  if (!jsonMatch) throw new Error("Keine gültige JSON-Antwort in der Klassifikation gefunden.");
  const parsed = JSON.parse(jsonMatch[0]);

  // Absicherung: falls die KI ein Ding vergisst, wird es sicherheitshalber
  // der NEIN-Gruppe zugeordnet, damit keine Kandidaten "verschwinden".
  const yes = batch.filter(c => (parsed.JA || []).includes(c));
  const no = batch.filter(c => !yes.includes(c));
  return { yes, no };
}

/* ---------- Einzelkandidat-Klassifikation ----------
   Einfacher, direkter Ja/Nein-Prompt für genau EINEN verbleibenden
   Kandidaten – zuverlässiger als der Listen-Prompt für diesen Fall,
   weil kein JSON-Array mit nur einem Eintrag interpretiert werden
   muss und die Frage direkt und unzweideutig gestellt wird.
------------------------------------------------------------------ */
async function classifySingleCandidate(question, candidate) {
  const studyHint = findProfessionStudyHint(question, topicName);
  const studyHintText = studyHint ? `\n${studyHint}` : "";
  const roadHint = findVehicleRoadHint(question, topicName);
  const roadHintText = roadHint ? `\n${roadHint}` : "";
  const foodHint = findFoodCategoryHint(question, topicName);
  const foodHintText = foodHint ? `\n${foodHint}` : "";
  const originHint = findAnimalOriginHint(question, topicName);
  const originHintText = originHint ? `\n${originHint}` : "";
  const featureHint = findProfessionFeatureHint(question, topicName);
  const featureHintText = featureHint ? `\n${featureHint}` : "";
  const animalHint = findAnimalFeatureHint(question, topicName); // VERSION 60
  const animalHintText = animalHint ? `\n${animalHint}` : "";

  const prompt = `Das gesuchte Ding ist: "${candidate}".
Frage: "${question}"${studyHintText}${roadHintText}${foodHintText}${originHintText}${featureHintText}${animalHintText}

Trifft diese Frage auf "${candidate}" zu?
Beachte: Männliche und weibliche Formen desselben Begriffs (z. B. "Sänger"/"Sängerin", "Arzt"/"Ärztin") gelten als dasselbe – wenn die Frage direkt nach "${candidate}" (in egal welcher Geschlechtsform) fragt, ist die Antwort JA. Ebenso gelten regionale Synonyme als dasselbe ("Velo" = "Fahrrad", "Töff" = "Motorrad", "Auto" = "Personenwagen" = "PKW").

Denke ZUERST kurz nach (1–2 Sätze): Prüfe die tatsächlichen Fakten zu "${candidate}", bevor du dich festlegst.

Schreibe DANACH auf einer eigenen, letzten Zeile ausschliesslich: ANTWORT: JA oder ANTWORT: NEIN`;

  const content = await callOpenAI([
        { role: "system", content: "Du beantwortest eine einfache Ja/Nein-Frage zu genau einem Ding. Denke kurz nach, dann antworte im vorgegebenen Format mit einer abschliessenden Zeile." },
        { role: "user", content: prompt }
      ], 0); // VERSION 60: mit Wiederholung
  const rawText = content.toUpperCase();
  // Robust: nur die letzte "ANTWORT: JA/NEIN"-Zeile zählt, nicht der
  // Denktext davor (der könnte "ja" oder "nein" beiläufig erwähnen).
  const answerMatch = rawText.match(/ANTWORT:\s*(JA|NEIN)/);
  const finalAnswer = answerMatch ? answerMatch[1] : rawText;
  const isYes = finalAnswer.includes("JA") && !finalAnswer.includes("NEIN");

  return isYes ? { yes: [candidate], no: [] } : { yes: [], no: [candidate] };
}

/* ---------- Generisch-Treffer-Prüfung (nur Runde 2, nur beim Sieg) ----------
   Manchmal trifft eine Gewinnfrage nur eine ALLGEMEINERE Kategorie,
   die zufällig auch als eigenständiges, spezifischeres Ding in der
   Liste vorkommt (z. B. Frage "Ist es Brot?" bei Geheimnis
   "Baguette" – korrekt im weiteren Sinn, aber "Brot" existiert auch
   separat in der Liste als generischere Variante). Diese Prüfung
   läuft NUR im Moment eines möglichen Sieges in Runde 2 (selten,
   daher vertretbarer Zusatzaufwand) und gibt einen Hinweis statt
   eines vollen Sieges, falls die Vermutung zu unspezifisch war.
------------------------------------------------------------------ */
async function checkGenericMatch(question, secret, topic) {
  const prompt = `In einem Ja/Nein-Ratespiel (Kategorie: "${topic}") wurde die Frage "${question}" gestellt und mit "Ja" beantwortet. Das tatsächliche Geheimnis ist "${secret}".

Ist "${secret}" GENAU das, wonach in der Frage gefragt wurde, oder fragt die Frage nach einer ALLGEMEINEREN/GRUNDLEGENDEREN Kategorie, zu der "${secret}" zwar korrekt gehört, aber es gäbe einen SPEZIFISCHEREN, passenderen Begriff (der z. B. auch als eigenständiges Ding in einer Liste zur Kategorie "${topic}" vorkommen könnte)?

Beispiel für NICHT exakt: Frage "Ist es Brot?", Geheimnis "Baguette" -> ein Baguette ist zwar Brot, aber "Brot" ist der allgemeinere Begriff, "Baguette" der spezifischere.
Beispiel für exakt: Frage "Ist es ein Baguette?", Geheimnis "Baguette" -> exakt derselbe Begriff.

Antworte AUSSCHLIESSLICH als reines JSON-Objekt, ohne zusätzlichen Text:
{"exakt": true oder false, "hinweis": "<falls nicht exakt: ein kurzer Satz wie 'Es ist ein Brot, aber ein bestimmtes Brot.', sonst leerer String>"}`;

  try {
    const content = await callOpenAI([
          { role: "system", content: "Du prüfst, ob eine Vermutung im Ratespiel exakt oder nur allgemein-kategorial richtig war. Antworte ausschliesslich mit validem JSON." },
          { role: "user", content: prompt }
        ], 0); // VERSION 60: mit Wiederholung
    let text = content;
    text = text.replace(/```json|```/g, "").trim();
    const parsed = JSON.parse(text);
    return { exact: parsed.exakt !== false, hint: (parsed.hinweis || "").trim() };
  } catch (err) {
    safeLog("Generisch-Treffer-Prüfung fehlgeschlagen, Sieg wird trotzdem gewertet:", err);
    return { exact: true, hint: "" };
  }
}

/* ---------- Kombinierte Analyse: Doppelfrage + Fragetyp ----------
   Fasst zwei frühere separate API-Aufrufe (Doppelfragen-Erkennung
   und semantische Fragetyp-Klassifikation) in EINEN Aufruf zusammen,
   um die Anzahl API-Calls pro Frage zu senken. Beide Prüfungen
   brauchen nur den Fragetext (+ Thema) – keine Abhängigkeit von der
   Kandidatenliste – lassen sich also unabhängig vom Klassifikations-
   Aufruf vorab in einem Rutsch beantworten.

   Gibt zurück: { isCompound: boolean, type: "constraint-seeking" | "hypothesis-scanning" }
   (type ist bei isCompound=true irrelevant und wird nicht verwendet)
------------------------------------------------------------------ */
async function analyzeQuestion(question, topic) {
  const prompt = `Du analysierst eine Frage aus einem Ja/Nein-Ratespiel. Die Kategorie des gesuchten Dings ist "${topic}".

Beantworte VIER Dinge zu diesem Text: "${question}"

0. IST ES EINE JA/NEIN-FRAGE: Lässt sich der Text grundsätzlich mit "Ja" oder "Nein" beantworten? Ja/Nein-Fragen beginnen typischerweise mit einem Verb oder Hilfsverb ("Ist...", "Hat...", "Kann...", "Arbeitet...", "Wird...", "Braucht...").
   W-Fragen sind KEINE Ja/Nein-Fragen, auch wenn sie inhaltlich sinnvoll und auf das gesuchte Ding bezogen sind – sie fragen nach einer offenen Information, nicht nach Ja/Nein: "Wer...", "Was...", "Wann...", "Wo...", "Warum...", "Wieso...", "Weshalb...", "Wie lange...", "Wie viel...", "Wie oft...", "Welche...".
   Beispiele NICHT Ja/Nein: "Wer macht diesen Beruf?", "Wie lange arbeitet man?", "Warum gibt es diesen Beruf?", "Wann entstand dieser Beruf?", "Was macht man da?".
   Beispiele Ja/Nein: "Ist es ein Beruf mit viel Kontakt zu Menschen?", "Arbeitet man draussen?", "Braucht man eine Ausbildung?".

1. GÜLTIGE SPIELFRAGE (nur relevant, falls es eine Ja/Nein-Frage ist): Ist das eine gültige Frage IN DIESEM SPIEL – also eine Frage oder ein kurzer Ausdruck, der sich auf eine mögliche EIGENSCHAFT oder IDENTITÄT DES GESUCHTEN DINGS (Kategorie: "${topic}") bezieht?

Antworte NEIN (ungültig) in JEDEM dieser Fälle:
- Zufällige Buchstabenfolge/sinnloses Tastatur-Gemenge (z. B. "setrtfzuhiklöälknjbhvgcfdxfcgvhbjknl").
- JEDE Aussage über das KIND SELBST statt über das gesuchte Ding – erkennbar an "Ich bin...", "Ich habe...", "Ich heisse...", "Mein/Meine...". Das gilt UNABHÄNGIG vom Inhalt der Aussage, auch wenn die genannte Eigenschaft (z. B. "gross und schwer") zufällig wie eine Eigenschaft klingt, die auch auf das gesuchte Ding zutreffen könnte. Beispiele: "Ich heisse Johnny", "Ich bin 12 Jahre alt", "Ich habe am 19.11 Geburtstag", "Ich bin gross und schwer" (auch DIES ist eine Aussage über das Kind, keine Frage zum gesuchten Ding!).
- Eine allgemeine Wissens-/Weltfrage, die NICHTS mit dem gesuchten Ding zu tun hat (z. B. "Wer hat das Spiel gewonnen?", "Am Freitag hat Argentinien gewonnen?", Sportergebnisse, Wetter, Uhrzeit).

Antworte JA (gültig) bei jeder echten Frage/jedem echten Ausdruck ÜBER DAS GESUCHTE DING (nicht über das Kind), auch wenn kurz, umgangssprachlich, unvollständig oder grammatikalisch unsauber (z. B. "Räder?", "gross?" oder "Ist es gross?" gelten als gültig).

2. Prüfe SYSTEMATISCH anhand dieser drei Kriterien, ob der Satz in Wirklichkeit ZWEI ODER MEHR getrennte Fragen enthält (nur relevant, falls es eine gültige Ja/Nein-Spielfrage ist):
   a) KONJUNKTION: Enthält der Satz ein verbindendes Wort zwischen zwei eigenständigen Aussagen ("und", "oder", "sowohl...als auch", "weder...noch", "aber", "beziehungsweise")?
   b) MEHRERE PRÄDIKATE: Gibt es mehr als eine Eigenschaft/Tätigkeit/Aussage, die JEWEILS EINZELN mit Ja oder Nein beantwortet werden müsste (d. h. die Antworten könnten für die beiden Teile unterschiedlich ausfallen)?
   c) AUSNAHME – EIN zusammenhängendes Konzept: Auch wenn (a) zutrifft, ist es TROTZDEM nur EINE Frage, wenn die verbundenen Begriffe zusammen EIN EINZIGES Konzept bilden. Die Ausnahme gilt NUR, wenn die verbundenen Begriffe zur SELBEN, ähnlichen Bedeutungsebene gehören (z. B. beides Altersgruppen, beides Fahrzeugtypen), NICHT wenn sie zu grundsätzlich VERSCHIEDENEN Kategorien gehören, bei denen die Antwort unterschiedlich ausfallen könnte:
      - Zielgruppen-Aufzählung (Ausnahme gilt): "mit Kindern und Jugendlichen" (beides Altersgruppen, ähnliche Bedeutungsebene)
      - Vergleich (Ausnahme gilt): "teurer als ein Motorrad", "grösser als ein Hund" (ein Vergleich nennt zwei Dinge, fragt aber nur EINE Sache ab)
      - Feste Wortpaare/Doppelbegriffe (Ausnahme gilt): "Katz und Maus", "schwarz-weiss"
      - Kategorien-Disjunktion (Ausnahme gilt NICHT, ist MEHRFACH!): "jemanden oder etwas" (Person vs. Sache sind grundverschiedene Kategorien – ein Beruf könnte Personen schützen, aber keine Sachen, oder umgekehrt), "drinnen oder draussen" wenn als zwei getrennte Eigenschaften gemeint, "Werkzeuge oder die Hände" (verschiedene Mittel, unterschiedliche Antworten möglich)
      - Unterschiedliche Dimensionen (Ausnahme gilt NICHT, ist MEHRFACH!): "gross und schwer" (Grösse und Gewicht sind zwei unabhängige Dimensionen – etwas kann gross und leicht sein, oder klein und schwer; die Antworten könnten sich unterscheiden), ebenso "schnell und laut", "teuer und selten"

   → Es gilt als MEHRFACH nur dann, wenn (a) UND (b) beide zutreffen UND (c) NICHT zutrifft.

   Beispiele für ZWEI Fragen auf einmal (MEHRFACH): "Arbeitet man draussen und mit Tieren?" (zwei unterschiedliche, einzeln beantwortbare Eigenschaften), "Ist es gross oder rund?", "Arbeitet man nicht mit Werkzeugen und nicht mit den Händen?", "Schützt man jemanden oder etwas?" (Person vs. Sache – grundverschiedene Kategorien), "Ist es gross und schwer?" (zwei unabhängige Dimensionen)
   Beispiele für EINE Frage (EINZEL): "Arbeitet man mit Kindern und Jugendlichen?" (Ausnahme c: Zielgruppe, ähnliche Bedeutungsebene), "Ist es teurer als ein Motorrad?" (Ausnahme c: Vergleich), "Hat es Räder?" (keine Konjunktion).

3. Falls es eine gültige Ja/Nein-EINZEL-Frage ist, welcher Typ:
   - "constraint-seeking": Die Frage bezieht sich auf eine Eigenschaft, ein Merkmal, eine Tätigkeit oder eine Untergruppe, die grundsätzlich auf MEHRERE unterschiedliche Dinge aus der Kategorie "${topic}" zutreffen könnte. Beispiele: "Arbeitet die Person meist draussen?", "Hat es Räder?", "Ist es aus Metall?". Das gilt AUCH für indirekte Verwendungs-/Eigenschaftsfragen über einen Umweg (ein Gericht, ein Werkzeug, eine andere Sache), z. B. "Kann man daraus Baba Ganoush machen?" (fragt nach einer VERWENDUNGSEIGENSCHAFT – "ist X eine dafür typische/verwendbare Zutat?" –, nennt aber NICHT direkt "Aubergine"), "Kann man damit Nägel einschlagen?" (fragt nach einer Eigenschaft, nennt nicht direkt "Hammer").
   - "hypothesis-scanning": Die Frage nennt oder erfragt DIREKT ein einzelnes, konkretes Ding aus der Kategorie "${topic}" beim NAMEN – im Kern "Ist es genau DAS eine bestimmte Ding (mit diesem Namen)?". Beispiele: "Ist es ein Bauer?", "Ist es ein Handy?", "Ist es Aubergine?".
   WICHTIG: Bewerte nur den Inhalt der Frage, unabhängig davon, wie viele echte Dinge in einer bestimmten Liste zufällig passen würden – das Kind kennt diese Liste nicht. Eine Frage wird NUR dann hypothesis-scanning, wenn sie den Namen des Dings selbst nennt/erfragt – ein Umweg über ein Gericht, einen Verwendungszweck oder ein anderes Objekt bleibt IMMER constraint-seeking, selbst wenn er stark auf ein bestimmtes Ding hindeutet.

Antworte AUSSCHLIESSLICH als reines JSON-Objekt, ohne zusätzlichen Text, ohne Markdown-Codeblock, in genau diesem Format:
{"ja_nein_frage": true oder false, "sinnvoll": true oder false, "konjunktion": true oder false, "mehrere_praedikate": true oder false, "ein_konzept_ausnahme": true oder false, "mehrfach": true oder false, "typ": "constraint-seeking" oder "hypothesis-scanning"}
(Falls ja_nein_frage=false, setze sinnvoll=false und alle weiteren Felder auf false bzw. "constraint-seeking" als Platzhalter. Falls sinnvoll=false, setze ebenso alle weiteren Felder auf false bzw. "constraint-seeking" als Platzhalter. mehrfach ergibt sich aus: konjunktion UND mehrere_praedikate UND NICHT ein_konzept_ausnahme.)`;

  try {
    const content = await callOpenAI([
          { role: "system", content: "Du analysierst Fragen in einem Ratespiel. Antworte ausschliesslich mit validem JSON im vorgegebenen Format." },
          { role: "user", content: prompt }
        ], 0); // VERSION 60: mit Wiederholung
    let text = content;
    text = text.replace(/```json|```/g, "").trim();
    const parsed = JSON.parse(text);
    const isNotYesNo = parsed.ja_nein_frage === false;
    const isMeaningless = parsed.sinnvoll === false;
    // isCompound wird hier selbst aus den drei Einzelkriterien
    // berechnet (statt nur parsed.mehrfach zu übernehmen) – das
    // erzwingt Konsistenz, falls das Modell die Kombination der
    // eigenen Kriterien mal falsch zusammenzählt.
    const isCompound = (parsed.konjunktion === true)
      && (parsed.mehrere_praedikate === true)
      && (parsed.ein_konzept_ausnahme !== true);
    const type = parsed.typ === "hypothesis-scanning" ? "hypothesis-scanning" : "constraint-seeking";
    return { isNotYesNo, isMeaningless, isCompound, type };
  } catch (err) {
    safeLog("Fragenanalyse fehlgeschlagen, Fallback auf Einzelfrage/constraint-seeking:", err);
    return { isNotYesNo: false, isMeaningless: false, isCompound: false, type: "constraint-seeking" };
  }
}

/* ---------- Vage-Frage-Erkennung ----------
   Prüft, ob die Frage ein unklares/subjektives Wort ohne festen
   Massstab enthält. Zwei Kategorien werden unterschieden:
   1. GRUPPE: Begriffe wie "Team", "Gruppe", "mit anderen zusammen",
      die mehrere beteiligte Personen andeuten, ohne eine genaue
      Anzahl zu nennen.
   2. ALLGEMEIN: sonstige vage/subjektive Wörter ohne Massstab
      (z. B. "gross", "gefährlich", "teuer", ohne Vergleichswert).
   Liefert zusätzlich ein zum Begriff UND Themenfeld passendes
   Beispiel (z. B. "gefährlich" bei Berufen -> "gefährlicher als
   Bauarbeiter", nicht ein themenfremdes "grösser als ein Hund").
   Gibt bei Erkennung { category, term, example } zurück, sonst null.
------------------------------------------------------------------ */
async function checkVagueQuestion(question) {
  // VERSION 57: Lokale, deutlich engere Prüfung statt KI-Aufruf.
  // In den Klassendaten wurden fast nur brauchbare Fragen als "vage"
  // abgelehnt (z. B. "Muss es stark sein?", "Hat es mit Haaren zu
  // tun?", "Braucht man mehrere Leute?"), was die Kinder frustriert hat.
  // Jetzt gilt eine Frage nur noch als vage, wenn sie
  //   (a) ein Massstab-Adjektiv aus der Liste unten OHNE Vergleich
  //       enthält (z. B. "Ist es gross?"), oder
  //   (b) ausdrücklich "Team" / "Gruppe" nennt.
  // Die Liste kann bei Bedarf ergänzt oder gekürzt werden.
  const VAGUE_ADJECTIVES = /\b(gross|groß|grosse|große|grosser|großer|grosses|großes|klein|kleine|kleiner|kleines|teuer|teure|teures|billig|billige|schnell|schnelle|langsam|langsame|gefährlich|gefährliche|gefaehrlich|schwer|schwere|alt|alte|älter|grösser|größer|teurer|schneller|langsamer|schwerer|gefährlicher)\b/i;
  const GROUP_WORDS = /\b(team|gruppe|gruppen)\b/i;

  if (GROUP_WORDS.test(question)) {
    return { category: "gruppe", term: (question.match(GROUP_WORDS) || [""])[0] };
  }
  const m = question.match(VAGUE_ADJECTIVES);
  if (m) return { category: "allgemein", term: m[0] };
  return null;
}

/* ---------- Rückfrage ----------
   Wird aufgerufen, wenn eine Frage ineffizient war (vorzeitiges
   Scannen oder kein Informationsgewinn). Gibt KEINE direkte
   Antwort und verrät NICHT die Lösung – regt stattdessen zum
   Nachdenken an, damit das Kind selbst auf eine bessere Frage kommt.
------------------------------------------------------------------ */
async function generateSocraticHint(question, reason, remainingCount) {
  const situation = reason === "premature"
    ? `Das Kind hat gerade geraten, dass es genau ein bestimmtes Ding ist ("${question}"), obwohl noch ${remainingCount} verschiedene Dinge aus der Kategorie "${topicName}" infrage kommen.`
    : `Das Kind hat die Frage "${question}" gestellt. Diese Frage hat die ${remainingCount} noch möglichen Dinge NICHT eingegrenzt – alle passen weiterhin gleich gut dazu.`;

  const prompt = `Du bist ein freundlicher, sokratischer Lerncoach für ein Kind der 5. Klasse, das ein Ja/Nein-Ratespiel spielt (Kategorie: "${topicName}").

${situation}

Formuliere EINE kurze, freundliche Rückfrage auf Deutsch, die das Kind zum Nachdenken anregt und es dazu bringt, selbst eine bessere, eingrenzende Frage zu finden.

WICHTIG:
- Verrate NICHT die Lösung.
- Schlage KEINE konkrete neue Frage direkt vor.
- Sei kurz (maximal 2 Sätze), warm und altersgerecht.
- Verwende KEINE Fachbegriffe wie "constraint-seeking" oder "Informationsgewinn".

Antworte NUR mit der Rückfrage selbst, ohne Anführungszeichen, ohne zusätzlichen Text.`;

  try {
    const content = await callOpenAI([
          { role: "system", content: "Du bist ein warmherziger, sokratischer Lerncoach für Kinder." },
          { role: "user", content: prompt }
        ], 0.7); // VERSION 60: mit Wiederholung
    return content;
  } catch (err) {
    safeLog("Sokratische Rückfrage fehlgeschlagen:", err);
    return "Überleg nochmal: Gibt es eine Frage, die dir hilft, mehrere Möglichkeiten gleichzeitig auszuschliessen?";
  }
}

/* ---------- Feedback der SuS ----------
   Speichert den Feedback-Text (falls vorhanden) direkt in den
   bereits "eingefrorenen" Daten der Runde (allRoundsData), damit er
   zusammen mit den übrigen Daten exportiert wird. Leerer Text ist
   gültig ("nichts aufgefallen").
------------------------------------------------------------------ */
function submitRoundFeedback() {
  const input = document.getElementById("feedbackInput");
  const text = input.value.trim();

  if (allRoundsData[currentRound]) {
    allRoundsData[currentRound].feedback = text;
  }

  input.disabled = true;
  document.getElementById("feedbackSaveBtn").disabled = true;
  document.getElementById("feedbackSavedNote").style.display = "inline";
}

/* ---------- Runde beenden & Auswertung ---------- */
function endRound(solved, endReason) {
  roundActive = false;
  document.getElementById("gameBox").classList.add("hidden");

  // Falls kein Grund explizit übergeben wurde (Absicherung), aus
  // "solved" ableiten.
  if (!endReason) endReason = solved ? "geloest" : "unbekannt";

  // Rundendaten "einfrieren" – log/coachingLog/listViewed werden beim
  // nächsten Rundenstart geleert, daher hier für den späteren Export
  // gesichert. feedback startet leer und wird erst gefüllt, wenn das
  // Kind das Feedback-Feld unten abschickt.
  allRoundsData[currentRound] = {
    log: [...log],
    coaching: [...coachingLog],
    chat: [...chatLog],
    listViewed: listViewed,
    secret: secret,
    solved: solved,
    endReason: endReason,
    originalCandidateCount: originalCandidateCount,
    feedback: ""
  };

  // Feedback-Feld für diese (neue) Zusammenfassung zurücksetzen –
  // das Element bleibt über alle drei Runden im DOM bestehen und
  // muss daher bei jedem Rundenende neu "entsperrt" werden.
  const feedbackInput = document.getElementById("feedbackInput");
  feedbackInput.value = "";
  feedbackInput.disabled = false;
  document.getElementById("feedbackSaveBtn").disabled = false;
  document.getElementById("feedbackSavedNote").style.display = "none";

  document.getElementById("summaryHeading").textContent = "Auswertung";

  const total = log.length;
  const constraintSeeking = log.filter(l => l.typ === "constraint-seeking").length;
  const hypothesisScanning = log.filter(l => l.typ === "hypothesis-scanning").length;
  const violations = log.filter(l => l.stopping_rule_verletzt === "ja").length;
  // WICHTIG: Fälle von vorzeitigem Scannen bzw. fehlendem Informations-
  // gewinn werden in Runde 2 vom Coach abgefangen (Denkanstoss statt
  // direkter Antwort) und landen dann NICHT im normalen "log", sondern
  // im separaten "coachingLog". Damit die Auswertung diese trotzdem
  // korrekt als "verletzt" zeigt, werden beide Quellen kombiniert.
  const premature = log.filter(l => l.vorzeitiges_scannen === "ja").length
    + coachingLog.filter(c => c.grund === "vorzeitiges_scannen").length;
  const noInfoGainCount = log.filter(l => l.kein_informationsgewinn === "ja").length
    + coachingLog.filter(c => c.grund === "kein_informationsgewinn").length;
  const idealRatioText = total > 0 ? `${Math.max(total - 1, 0)} : 1` : "–";

  const endReasonLabels = {
    geloest: "Gelöst",
    max_fragen_erreicht: "Maximale Fragenzahl erreicht (20)",
    manuell_beendet: "Manuell beendet",
    unbekannt: "Unbekannt"
  };

  const rows = [
    ["Gesuchtes Ding", secret],
    ["Gelöst", solved ? "ja" : "nein"],
    ["Beendet durch", endReasonLabels[endReason] || endReason],
    ["Gesamtzahl Fragen", total],
    ["Constraint-seeking Fragen", constraintSeeking],
    ["Hypothesis-scanning Fragen", hypothesisScanning],
    ["Ideales Verhältnis (n−1):1", idealRatioText],
    ["Stopping-Rule-Verletzung", violations > 0 ? "verletzt" : "nicht verletzt"],
    ["Vorzeitiges Scannen (Einzelvermutung zu früh)", premature > 0 ? "verletzt" : "nicht verletzt"],
    ["Fragen ohne Informationsgewinn", noInfoGainCount],
    ["Kandidatenliste angeschaut", listViewed ? "ja" : "nein"]
  ];

  if (currentRound === 2) {
    rows.push(["Coaching-Eingriffe", coachingLog.length]);
  }

  const table = document.getElementById("summaryTable");
  table.innerHTML = rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("");

  const banner = document.getElementById("congratsBanner");
  if (solved) {
    banner.style.display = "block";
    banner.textContent = `🎉 Gut gemacht! Du hast «${secret}» in ${log.length} Fragen erraten!`;
    setAvatarMood("celebrating");
    playWinSound();
    triggerConfetti();
  } else {
    banner.style.display = "none";
  }

  // Coaching-CSV nur anbieten, wenn es in dieser Runde auch Eingriffe gab
  // VERSION 59: separater Coaching-Export entfernt (im Gesamt-Export enthalten).

  document.getElementById("summary").style.display = "block";
}

/* ---------- CSV speichern / teilen ----------
   Auf iPad/iPhone wird – falls verfügbar – das Teilen-Menü von iOS
   geöffnet (AirDrop, "In Dateien sichern", Mail …), damit die CSV
   direkt als Datei weitergegeben werden kann, statt als Tabelle in
   einem neuen Fenster zu erscheinen. Auf dem Laptop oder wenn das
   Teilen-Menü nicht unterstützt wird: normaler Download wie bisher.
   Das vorangestellte "\uFEFF" (BOM) sorgt dafür, dass Excel die
   Umlaute (ä/ö/ü) korrekt anzeigt.
------------------------------------------------------------------ */
async function saveCsvFile(lines, filename) {
  const content = "\uFEFF" + lines.join("\n");
  const blob = new Blob([content], { type: "text/csv;charset=utf-8;" });

  try {
    const isTouchDevice = /iPad|iPhone|iPod/.test(navigator.userAgent)
      || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); // iPadOS meldet sich als Mac
    if (isTouchDevice && typeof File === "function" && navigator.canShare) {
      const file = new File([blob], filename, { type: "text/csv" });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: filename });
        return;
      }
    }
  } catch (err) {
    // Abbruch durch Nutzer:in ("AbortError") -> nichts weiter tun
    if (err && err.name === "AbortError") return;
    safeLog("Teilen fehlgeschlagen, normaler Download wird verwendet:", err);
  }

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ---------- CSV-Export ---------- */
function downloadCSV() {
  const headers = ["Kind", "Fragenummer","Frage","Antwort","Kandidaten_vorher","Kandidaten_vorher_Prozent","Kandidaten_nachher","Kandidaten_nachher_Prozent","Fragetyp","Stopping_Rule_verletzt","Vorzeitiges_Scannen","Kein_Informationsgewinn","Liste_angeschaut_nach_Frage","Beendet_durch","Feedback_SuS"];
  const lines = [headers.join(";")];
  const endReason = (allRoundsData[currentRound] && allRoundsData[currentRound].endReason) || "unbekannt";
  // Zeilenumbrüche im Freitext entfernen, damit die CSV-Zeilenstruktur
  // (eine Datenzeile pro Zeile) nicht durcheinandergerät.
  const feedbackRaw = (allRoundsData[currentRound] && allRoundsData[currentRound].feedback) || "";
  const feedbackClean = feedbackRaw.replace(/[\r\n]+/g, " ").replace(/"/g, '""');
  // Prozent bezieht sich auf die ursprüngliche Suchraumgrösse dieser
  // Runde (z. B. 128 bei "Anspruchsvoll"), nicht auf 100 Fragen o. ä.
  const pct = n => originalCandidateCount > 0 ? (n / originalCandidateCount * 100).toFixed(1) : "";

  log.forEach((l, i) => {
    const isFirst = i === 0;
    const isLast = i === log.length - 1;

    // Liste-Info steht nur in der Zeile, die zur Fragenummer gehört,
    // nach der geöffnet wurde. Wurde vor Frage 1 geöffnet (Fragenummer
    // 0), landet der Hinweis in der ersten Zeile. Wurde nie geöffnet,
    // steht "nein" einmalig in der ersten Zeile.
    let listeField = "";
    if (listViewed) {
      if (listViewedAtQuestion === l.nr) {
        listeField = String(listViewedAtQuestion);
      } else if (listViewedAtQuestion === 0 && isFirst) {
        listeField = "vor Frage 1";
      }
    } else if (isFirst) {
      listeField = "nein";
    }

    lines.push([
      isFirst ? childName : "",
      l.nr,
      '"' + l.frage.replace(/"/g,'""') + '"',
      l.antwort, l.kandidaten_vorher, pct(l.kandidaten_vorher), l.kandidaten_nachher, pct(l.kandidaten_nachher),
      l.typ, l.stopping_rule_verletzt, l.vorzeitiges_scannen, l.kein_informationsgewinn,
      listeField,
      isLast ? endReason : "",
      isLast ? ('"' + feedbackClean + '"') : ""
    ].join(";"));
  });

  // Falls die Runde ganz ohne Fragen beendet wurde (leeres log), gäbe
  // es sonst keine Zeile für Kind/Beendet_durch/Feedback – hier wird
  // dafür eine einzelne Zeile ergänzt, damit nichts verloren geht.
  if (log.length === 0) {
    lines.push([
      childName,
      "", "", "", "", "", "", "", "", "", "", "",
      "",
      endReason,
      '"' + feedbackClean + '"'
    ].join(";"));
  }

  saveCsvFile(lines, `fragekompetenz_${childName}_training.csv`);
}

/* ---------- VERSION 58: Gesamt-Export (Chatverlauf + Ergebnisse) ----------
   EINE CSV-Datei mit dem ganzen Chatverlauf: eine Zeile pro Nachricht
   (Kind, Chatbot, System). Bei Kind-Nachrichten, die als Frage gezählt
   wurden, stehen in derselben Zeile die Ergebnisse (Antwort, Kandidaten
   vorher/nachher, Fragetyp, Stopping Rule usw.). Bei Coaching-Eingriffen
   steht der Grund. Rundenangaben (Kind, Thema, gesuchtes Ding, Ende)
   stehen in jeder Zeile, damit man in Excel einfach filtern kann.
   Das Feedback des Kindes erscheint als letzte Zeile.
   Die bisherigen Exporte (Training, Coaching) bleiben unverändert.
------------------------------------------------------------------ */
function downloadFullCSV() {
  const round = allRoundsData[currentRound] || {};
  const chat = round.chat || chatLog;
  const roundLog = round.log || log;
  const endReason = round.endReason || "unbekannt";
  const q = v => '"' + String(v == null ? "" : v).replace(/[\r\n]+/g, " ").replace(/"/g, '""') + '"';
  const pct = n => originalCandidateCount > 0 ? (n / originalCandidateCount * 100).toFixed(1) : "";

  const headers = ["Kind", "Thema", "Gesuchtes_Ding", "Beendet_durch", "Zeile", "Zeit", "Absender", "Nachricht",
    "Gezaehlt_als_Frage", "Fragenummer", "Antwort", "Kandidaten_vorher", "Kandidaten_vorher_Prozent",
    "Kandidaten_nachher", "Kandidaten_nachher_Prozent", "Fragetyp", "Stopping_Rule_verletzt",
    "Vorzeitiges_Scannen", "Kein_Informationsgewinn", "Coaching_Grund", "Liste_angeschaut_nach_Frage",
    "Antwortquelle", "Antwort_korrigiert"]; // VERSION 60: zwei neue Spalten am Ende
  const lines = [headers.join(";")];

  const listeInfo = !listViewed ? "nein" : (listViewedAtQuestion === 0 ? "vor Frage 1" : String(listViewedAtQuestion));
  const base = () => [q(childName), q(topicName), q(round.secret || secret), endReason];

  chat.forEach((c, i) => {
    const r = c.nr != null ? roundLog.find(l => l.nr === c.nr) : null;
    const isKid = c.rolle === "Kind";
    lines.push([
      ...base(), i + 1, c.zeit, q(c.rolle), q(c.text),
      isKid ? (r ? "ja" : "nein") : "",
      r ? r.nr : "", r ? r.antwort : "",
      r ? r.kandidaten_vorher : "", r ? pct(r.kandidaten_vorher) : "",
      r ? r.kandidaten_nachher : "", r ? pct(r.kandidaten_nachher) : "",
      r ? r.typ : "", r ? r.stopping_rule_verletzt : "", r ? r.vorzeitiges_scannen : "",
      r ? r.kein_informationsgewinn : "", q(c.coaching),
      i === 0 ? listeInfo : "",
      r ? q(r.quelle || "") : "", r ? (r.korrigiert || "") : ""
    ].join(";"));
  });

  const feedback = round.feedback || "";
  lines.push([
    ...base(), chat.length + 1, "", q("Feedback (Kind)"), q(feedback),
    "", "", "", "", "", "", "", "", "", "", "", '""', "", "", ""
  ].join(";"));

  saveCsvFile(lines, `fragekompetenz_${childName}_gesamt.csv`);
}

/* ---------- Coaching-Log-Export ----------
   Separates CSV: jede Rückfrage, die dem Kind gegeben
   wurde, inkl. Grund und der Frage, die den Eingriff auslöste.
------------------------------------------------------------------ */
function downloadCoachingCSV() {
  const headers = ["Kind", "Versuch","Frage","Grund","Sokratische_Rueckfrage"];
  const lines = [headers.join(";")];
  coachingLog.forEach(c => {
    lines.push([
      childName, c.versuch,
      '"' + c.frage.replace(/"/g,'""') + '"',
      c.grund,
      '"' + c.rueckfrage.replace(/"/g,'""') + '"'
    ].join(";"));
  });
  saveCsvFile(lines, `fragekompetenz_${childName}_coaching.csv`);
}

/* ---------- Chatverlauf-Rückblick ----------
   Zeigt den kompletten Chat der beendeten Runde nochmal an (read-only),
   damit Fehlermeldungen im Nachhinein gefunden und gemeldet werden
   können. Der Chat-Inhalt bleibt im DOM erhalten, nur das gameBox
   war ausgeblendet – hier wird lediglich eine Kopie angezeigt.
------------------------------------------------------------------ */
function showChatReview() {
  document.getElementById("chatReviewContent").innerHTML = chatDiv.innerHTML;
  document.getElementById("summary").style.display = "none";
  document.getElementById("chatReview").classList.remove("hidden");
}

function hideChatReview() {
  document.getElementById("chatReview").classList.add("hidden");
  document.getElementById("summary").style.display = "block";
}

function resetAll() {
  currentRound = 1;
  allRoundsData = { 2: null };
  lastClassification = null;
  questionClassifications = {};
  chatDiv.innerHTML = "";
  document.getElementById("chatReviewContent").innerHTML = "";

  // PIN-Freischaltung gilt nur pro Kind – für das nächste Kind muss
  // die Lehrperson die PIN erneut eingeben.
  teacherModeUnlocked = false;
  document.getElementById("debugBtn").classList.add("hidden");
  document.getElementById("chatReviewBtn").classList.add("hidden");

  document.getElementById("summary").style.display = "none";
  document.getElementById("chatReview").classList.add("hidden");
  document.getElementById("setupBox").classList.remove("hidden");
}
</script>
